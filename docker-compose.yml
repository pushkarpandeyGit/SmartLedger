version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: smartledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: smartledger-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./smartledger.db
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: smartledger-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend